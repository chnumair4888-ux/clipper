name: Clipper
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video link"
        required: true
      clips:
        description: "Kitne clips"
        default: "5"
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -U yt-dlp gdown faster-whisper requests
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_URL: ${{ github.event.inputs.url }}
          NUM_CLIPS: ${{ github.event.inputs.clips }}
        run: python clip.py
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: out/*
