name: Clipper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video link"
        required: true
        type: string
      clips:
        description: "Number of clips"
        default: "5"
        type: string
      orientation:
        description: "Video shape"
        type: choice
        default: vertical
        options: [vertical, horizontal, both]
      length:
        description: "Clip length"
        type: choice
        default: short
        options: [short, medium, long]
      captions:
        description: "Captions"
        type: choice
        default: words
        options: [words, lines, none]
      background:
        description: "Background"
        type: choice
        default: blur
        options: [blur, crop, black]
      language:
        description: "Language"
        type: choice
        default: English
        options: [English, "Roman Urdu"]
      edit_style:
        description: "Editing style"
        type: choice
        default: auto
        options: [auto, viral, cinematic, funny, esports]
      audio_mode:
        description: "Audio mode"
        type: choice
        default: original
        options: [original, auto, commentary, music, original+music]
      voice_language:
        description: "Voice language"
        type: choice
        default: en
        options: [en, roman_urdu, hi]
      voice_gender:
        description: "Voice gender"
        type: choice
        default: auto
        options: [auto, male, female]
      title_overlay:
        description: "Title overlay"
        type: choice
        default: "yes"
        options: ["yes", "no"]
      brand:
        description: "Channel name"
        required: false
        type: string
      range:
        description: "Video minutes range"
        required: false
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install yt-dlp gdown faster-whisper requests edge-tts pillow uroman

      - name: Check Python syntax
        run: python -m py_compile clipper.py

      - name: Run clipper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VIDEO_URL: ${{ inputs.url }}
          NUM_CLIPS: ${{ inputs.clips }}
          ORIENT: ${{ inputs.orientation }}
          LENGTH: ${{ inputs.length }}
          CAPS: ${{ inputs.captions }}
          BG: ${{ inputs.background }}
          LANG_CODE: ${{ inputs.language }}
          EDIT_STYLE: ${{ inputs.edit_style }}
          AUDIO_MODE: ${{ inputs.audio_mode }}
          VOICE_LANG: ${{ inputs.voice_language }}
          VOICE_GENDER: ${{ inputs.voice_gender }}
          TITLE_ON: ${{ inputs.title_overlay }}
          BRAND: ${{ inputs.brand }}
          RANGE: ${{ inputs.range }}
        run: |
          python clipper.py

      - name: Upload clips to Oracle
        if: success()
        env:
          ORACLE_UPLOAD_URL: ${{ secrets.ORACLE_UPLOAD_URL }}
          ORACLE_UPLOAD_TOKEN: ${{ secrets.ORACLE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_UPLOAD_URL"
          test -n "$ORACLE_UPLOAD_TOKEN"
          find out -type f -name '*.mp4' -print0 | while IFS= read -r -d '' file; do
            name="${file#out/}"
            name="${name//\//_}"
            echo "Uploading $name"
            curl --fail --show-error --silent \
              --retry 2 \
              -X POST "$ORACLE_UPLOAD_URL/upload/$name" \
              -H "Authorization: Bearer $ORACLE_UPLOAD_TOKEN" \
              -H "Content-Type: video/mp4" \
              --data-binary @"$file"
            echo
            echo "Public URL: $ORACLE_UPLOAD_URL/files/$name"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaming-clips
          path: out/
          if-no-files-found: warn
